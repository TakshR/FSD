<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #c {
            margin: 25%;
            width: 150px;
            height: 350px;
            border-radius: 6%;
            background-color: black;
            position: relative;
        }
        #d {
            width: 69px;
            height: 69px;
            border-radius: 100%;
            background-color: red;
            position: absolute;
            top: 25px;
            right: 40px;
            opacity: 0.3;
            animation-name: "red";
            animation-duration: 8s; /* Total loop duration */
            animation-iteration-count: infinite;
        }
        #e {
            width: 69px;
            height: 69px;
            border-radius: 100%;
            background-color: yellow;
            position: absolute;
            top: 125px;
            right: 40px;
            opacity: 0.3;
            animation-name: "yellow";
            animation-duration: 8s; /* Total loop duration */
            animation-iteration-count: infinite;
        }
        #f {
            width: 69px;
            height: 69px;
            border-radius: 100%;
            background-color: green;
            position: absolute;
            top: 225px;
            right: 40px;
            opacity: 0.3;
            animation-name: "green";
            animation-duration: 8s; /* Total loop duration */
            animation-iteration-count: infinite;
        }

        /* Each light is ON (opacity 1) for 33% of the time, and OFF (opacity 0.3) for the rest */
        @keyframes red {
            0%, 33% { opacity: 1; }
            34%, 100% { opacity: 0.3; }
        }
        @keyframes yellow {
            0%, 33% { opacity: 0.3; }
            34%, 66% { opacity: 1; }
            67%, 100% { opacity: 0.3; }
        }
        @keyframes green {
            0%, 66% { opacity: 0.3; }
            67%, 100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="c">
        <div id="d"></div>
        <div id="e"></div>
        <div id="f"></div>
    </div>
</body>
</html>
